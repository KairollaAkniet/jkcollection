{% extends 'main/base.html' %}

{% block title %} Редактирование темы {{ post.id }} {% endblock %}

{% block content %} 

<form method="post" class="form-control d-flex flex-column gap-2">
    <input value="{{ post.jacket }}" name="jacket" type="text" placeholder="Размер jacket" class="form-control">
    <input value="{{ post.tshirt }}" name="tshirt" type="text" placeholder="Размер t-shirt" class="form-control">
    <input value="{{ post.jins }}" name="jins" type="text" placeholder="Размер jins" class="form-control">
    <input value="Обновить" type="submit" class="btn btn-success">
</form>
{% endblock %}
