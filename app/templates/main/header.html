<div class="header-inner">
    <a href="{{ url_for('post.all') }}" class="brand" aria-label="JKCOLLECTION — главная">
        <span class="brand-symbol"><img src="{{ url_for('static', filename='img/logo.jpg') }}" alt=""></span>
        <span>JKCOLLECTION</span>
    </a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="header-nav">Меню <span aria-hidden="true">☰</span></button>
    <nav class="header-nav" id="header-nav" aria-label="Категории">
        <a href="{{ url_for('post.all', category='jackets') }}#catalog">JACKETS</a>
        <a href="{{ url_for('post.all', category='jeans') }}#catalog">JEANS</a>
        <a href="{{ url_for('post.all', category='tshirts') }}#catalog">T-SHIRTS</a>
        <a href="{{ url_for('post.all', category='albums') }}#catalog">ALBUMS</a>
        <a href="{{ url_for('post.all', category='accessories') }}#catalog">ACCESSORIES</a>
    </nav>
    <div class="header-actions">
        {% if current_user.is_authenticated %}
            <span class="user-name">{{ current_user.login }}</span>
            <a href="{{ url_for('user.logout') }}">Выйти</a>
        {% else %}
            <a href="{{ url_for('user.login') }}">Войти</a>
            <a class="register-link" href="{{ url_for('user.register') }}">Регистрация</a>
        {% endif %}
        <button class="cart-button" type="button" data-open-cart aria-label="Открыть корзину">
            <svg width="23" height="25" viewBox="0 0 24 26" fill="none" aria-hidden="true"><path d="M4 8h16l2 16H2L4 8Z M8 10V6a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            <span class="cart-word">Корзина</span> <span class="cart-count">(0)</span>
        </button>
    </div>
</div>
